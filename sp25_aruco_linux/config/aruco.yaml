%YAML:1.0
---
dictionary: 0

detector:
   normal:
      adaptive_thresh_win_size_min: 3
      adaptive_thresh_win_size_max: 23
      adaptive_thresh_win_size_step: 4
      adaptive_thresh_constant: 7
   shadow:
      adaptive_thresh_win_size_min: 5
      adaptive_thresh_win_size_max: 41
      adaptive_thresh_win_size_step: 6
      adaptive_thresh_constant: 5
   low_contrast:
      adaptive_thresh_win_size_min: 7
      adaptive_thresh_win_size_max: 51
      adaptive_thresh_win_size_step: 6
      adaptive_thresh_constant: 9

illumination:
   enable_local_normalization: 1
   gaussian_sigma: 15.0
   enable_clahe: 1
   clahe_clip_limit: 2.0
   clahe_grid_size: 8
   enable_gamma: 1
   gamma_dark: 0.7
   gamma_bright: 1.3

quality:
   min_border_score: 0
   min_contrast_score: 0
   min_total_score: 0

solver:
   max_reprojection_error: 3.0